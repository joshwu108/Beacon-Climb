name: CI
on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    # API tests start their own Postgres 17 via Testcontainers (services/api/src/test/.../AbstractPostgresIT),
    # initialised with infra/compose/postgres/init.sql, so no service container or password env is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check and test API
        run: ./gradlew :api:spotlessCheck :api:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: api-junit
          path: services/api/build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Elapsed
        if: always()
        run: |
          echo "API wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BC-0123c F9b: fail on high/critical advisories in the resolved lockfile (prod + dev). The
      # Java side has no equivalent here: OWASP dependency-check needs the NVD feed (network + an
      # API key), so it is not run in CI; see docs/reviews/BC-0123-security-review.md F9.
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @beacon/web lint
      - run: pnpm --filter @beacon/web test
      - run: pnpm --filter @beacon/web build
      - run: pnpm --filter @beacon/web size
      - name: Elapsed
        if: always()
        run: |
          echo "Web wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv python install 3.12.14
      - run: uv run --directory services/ml --locked ruff check .
      - run: uv run --directory ml --no-project --with ruff==0.17.0 ruff check .
      - run: uv run --directory services/ml --locked pytest
      # BC-0212: the training, registry and smoke-model tests need numpy, scikit-learn and
      # torch; without the groups they would be skipped silently (importorskip).
      - run: uv run --directory ml --locked --group train --group torch-cpu pytest
      - name: Elapsed
        if: always()
        run: |
          echo "ML wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - run: bash test/guards/check-no-licensed-data.test.sh
      - run: scripts/ci/check-no-licensed-data.sh
      - run: scripts/ci/check-ownership.sh
      - name: Elapsed
        if: always()
        run: |
          echo "Guards wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Elapsed
        if: always()
        run: |
          echo "Gitleaks wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beacon/web exec playwright install --with-deps chromium
      - run: pnpm --filter @beacon/web test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Elapsed
        if: always()
        run: |
          echo "Web e2e wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  compose-smoke:
    # BC-0120: the documented laptop flow on a clean clone: `make dev && make seed-demo`
    # (postgres, api, nginx web image, synthetic board, demo + admin users), then the SPA
    # and the API answer through their published 127.0.0.1 ports. Throwaway secrets only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Write throwaway .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "BEACON_MIGRATE_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "BEACON_APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "BEACON_ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } > .env
      - name: make dev (jar, web image, core profile, wait for healthchecks)
        run: make dev
      - name: make seed-demo
        run: make seed-demo
      - name: Smoke the published ports
        run: |
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root"></div>'
          curl -fsS http://127.0.0.1:3000/v1/consent/current | grep -q '"text_sha256"'
          curl -fsS http://127.0.0.1:3000/health/ready
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml --profile core logs --no-color --tail 200
      - name: Tear down (drops volumes)
        if: always()
        run: make reset-db
      - name: Elapsed
        if: always()
        run: |
          echo "Compose smoke wall-clock: $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"
