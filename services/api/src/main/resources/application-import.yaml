# BC-0105: `--spring.profiles.active=import` turns the jar into the catalog importer CLI.
# No web server; Flyway still runs so the schema is current before rows are written.
spring:
  main:
    web-application-type: none
    banner-mode: off
logging:
  level:
    root: WARN
    com.beaconclimb.api.catalog.importer: INFO
  structured:
    format:
      # The importer is a CLI read by a person; an empty format restores the plain pattern.
      console: ""
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p %logger{0} - %m%n"
