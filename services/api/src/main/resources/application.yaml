spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beacon}
    username: ${POSTGRES_USER:beacon}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          additional-path: server:/health/live
        readiness:
          include: readinessState,db
          additional-path: server:/health/ready
