spring:
  application:
    # service.name in the structured (ECS) log lines.
    name: beacon-api
  datasource:
    # Runtime role: DML only. No password fallback; an unset variable fails startup.
    url: ${BEACON_DB_URL:jdbc:postgresql://127.0.0.1:5432/beacon}
    username: ${BEACON_APP_DB_USER:beacon_app}
    password: ${BEACON_APP_DB_PASSWORD}
  flyway:
    # BC-0123 F6: a future one-shot migrate service runs Flyway alone; the long-running api then
    # starts with BEACON_FLYWAY_ENABLED=false and no migrate password (docs/runbooks/dev-stack.md).
    # The compose stack still migrates from the api on startup.
    enabled: ${BEACON_FLYWAY_ENABLED:true}
    # Migration role owns the schema (infra/compose/postgres/init.sql).
    user: ${BEACON_MIGRATE_DB_USER:beacon_migrate}
    password: ${BEACON_MIGRATE_DB_PASSWORD}
  jackson:
    deserialization:
      # Contract schemas are additionalProperties:false; an unknown member is 422 UNKNOWN_FIELD
      # (ADR-0002, ApiExceptionHandler).
      fail-on-unknown-properties: true
beacon:
  auth:
    # ADR-0005: 10 failed login attempts per 15 minutes per username and per client IP.
    login-limit: 10
    login-window: 15m
    # ADR-0005: opaque bearer tokens live 24 h (2 h on a public demo, privacy doc section 7).
    session-ttl: 24h
    # BC-0123 F1: at most this many Argon2 hashes (64 MiB of heap each) run at once; a request
    # waits up to hash-wait for a slot and is otherwise 503 SERVICE_UNAVAILABLE with Retry-After.
    max-concurrent-hashes: 3
    hash-wait: 2s
    # BC-0123c (F5 residual): accounts one client address may create per UTC day, counted in
    # SQL (account_creations, V8); the next registration is 429 RATE_LIMITED with Retry-After
    # set to the seconds until midnight UTC. Keyed like the other per-IP limits (ClientAddress),
    # so behind an unlisted proxy every browser user shares it (docs/runbooks/dev-stack.md).
    register-per-ip-per-day: 20
  http:
    # BC-0122 (HttpProperties). Bodies above this are 413 PAYLOAD_TOO_LARGE (TM-25).
    max-body-bytes: 65536
    # Writes (POST/PUT/PATCH/DELETE under /v1/) per authenticated user per minute; 429 above.
    write-limit-per-minute: 60
    # Unauthenticated POSTs (register, session) per client IP: the bucket holds public-burst
    # tokens and refills at public-write-limit-per-minute (BC-0123 F1: each of these costs an
    # Argon2 hash, so no 30-request burst), on top of the login failure limiter (beacon.auth.*).
    public-write-limit-per-minute: 30
    public-burst: 5
    # Size cap of the in-memory bucket map before idle buckets are evicted.
    max-tracked-clients: 10000
    # BC-0123 F3: X-Forwarded-For is believed only when the socket peer is in this list of IP
    # literals or CIDR ranges, and only behind a proxy that overwrites the header (the compose
    # nginx sets it from $remote_addr). Empty by default: every peer is its own limiter key, so
    # behind nginx all browser traffic shares one key (docs/runbooks/dev-stack.md).
    trusted-proxies: []
    # Exact origins of the web client (apps/web dev server); no credentials.
    cors-allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  decisions:
    # BC-0111 (DecisionsProperties, ADR-0003). Content-addressed candidate snapshots are written
    # under <dir>/<first two hex>/<sha256>.json; the logical URI in the record is always
    # data/decisions/... regardless of where the store is rooted.
    dir: ${BEACON_DECISIONS_DIR:data/decisions}
    # TM-25: hard cap on snapshot files in the store; a request that would exceed it is 503
    # SERVICE_UNAVAILABLE and no decision is written.
    max-files: 100000
    # BC-0123 F5: new decisions one user may create per UTC day before 429 RATE_LIMITED, so one
    # account cannot fill max-files for everyone.
    max-per-user-per-day: 500
  stream:
    # BC-0301 (StreamProperties). Off by default: every Kafka bean is conditional on this flag,
    # so `make dev` (core profile) and the test suite run without a broker. `make stream-up`
    # loads infra/compose/kafka.yml, which sets BEACON_STREAM_ENABLED=true on the api service.
    enabled: ${BEACON_STREAM_ENABLED:false}
    # kafka:9092 inside compose (kafka.yml); 127.0.0.1:9094 is the host listener.
    bootstrap-servers: ${BEACON_STREAM_BOOTSTRAPSERVERS:127.0.0.1:9094}
    topics:
      attempts: attempts.v1
      features: climber-features.v1
      dlq: stream-dlq.v1
      reconciliation: stream-reconciliation.v1
    publisher:
      # One poll = one transaction: SELECT ... FOR UPDATE SKIP LOCKED up to batch-size rows,
      # send them all, wait, UPDATE published_at, commit; then one aggregate query over the
      # partial index (published_at IS NULL) refreshes the backlog gauges.
      poll-interval: 500ms
      batch-size: 200
      # Rows unpublished for longer than this count as stale (beacon_outbox_stale_rows,
      # OutboxReconciliation, `make outbox-status`).
      stale-after: 60s
      # Producer delivery.timeout.ms / request.timeout.ms: a dead broker fails a batch in
      # about ten seconds; the rows stay unpublished and the next poll retries (at-least-once).
      delivery-timeout: 10s
      request-timeout: 5s
    consumer:
      materializer-group-id: beacon-materializer
      reconciliation-group-id: beacon-reconciliation
logging:
  structured:
    format:
      # BC-0122: one JSON (Elastic Common Schema) line per event. MDC request_id and user_id
      # (pseudonymous, TM-16/TM-33) and the access-log key-values are top-level members.
      console: ecs
management:
  endpoints:
    web:
      # Contract paths are /health/live and /health/ready (contracts/openapi.yaml).
      # Boot 4.1 rejects multi-segment additional-path values, so the health endpoint
      # is mounted at /health and the groups below resolve to /health/<group>.
      base-path: /
      path-mapping:
        health: health
      exposure:
        # BC-0301: the Prometheus scrape (outbox gauges/counters, BC-0308) is /prometheus on
        # 127.0.0.1:8080 only; nginx does not proxy it. Health paths above are unchanged.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
