spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beacon}
    username: ${POSTGRES_USER:beacon}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      # Contract paths are /health/live and /health/ready (contracts/openapi.yaml).
      # Boot 4.1 rejects multi-segment additional-path values, so the health endpoint
      # is mounted at /health and the groups below resolve to /health/<group>.
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState,db
