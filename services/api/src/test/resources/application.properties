# Test-classpath overrides of services/api/src/main/resources/application.yaml (a .properties
# file beside the .yaml is loaded too and outranks it; @SpringBootTest(properties=...) outranks
# both). The suite registers hundreds of users from 127.0.0.1 against one shared Postgres per
# JVM, so the production default of the per-address daily account-creation cap (20, BC-0123c)
# would trip mid-suite; AuthRegistrationCapIT lowers it again for its own context.
beacon.auth.register-per-ip-per-day=1000000
