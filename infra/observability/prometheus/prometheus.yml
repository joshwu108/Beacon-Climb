# BC-0308: Prometheus scrape configuration for the `observability` compose profile
# (infra/compose/observability.yml). Every target is an in-network container name; nothing here
# is reachable from the LAN (the Prometheus UI itself is published on 127.0.0.1:9090 only).
# Scrape interval 5 s because the outbox gauges are refreshed every 500 ms poll and the Flink
# checkpoint interval is 10 s; a 15 s default would hide a whole checkpoint. Retention is set on
# the command line in observability.yml (--storage.tsdb.retention.time=2d).
# Runbook: docs/runbooks/observability.md.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Spring Boot actuator, micrometer-registry-prometheus (management.endpoints.web.base-path: /
  # plus the `prometheus` id, so the path is /prometheus, BC-0301). Carries beacon_outbox_*,
  # beacon_materializer_*, kafka_consumer_* (materializer consumer) and http_server_requests_*.
  - job_name: beacon-api
    metrics_path: /prometheus
    static_configs:
      - targets: ["api:8080"]

  # Flink PrometheusReporter (flink-metrics-prometheus, shipped in /opt/flink/plugins of the
  # flink:2.2.1 image; enabled through -Dmetrics.reporter.prom.* in observability.yml).
  # Both targets are DOWN when the stream profile is not running (make dev + observability-up);
  # the dashboard's Flink row is empty then, nothing else breaks.
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
