# BC-0120: nginx front for the compose `core` profile (apps/web/Dockerfile).
# Serves the Vite build with an SPA fallback and reverse-proxies the API under the same
# origin, so the browser never makes a cross-origin request (no CORS, see the runbook
# docs/runbooks/dev-stack.md). Runs as the unprivileged nginx user on 8080; the image's
# nginx.conf keeps pid and temp files under /tmp, which compose mounts as tmpfs on a
# read-only root filesystem.

server_tokens off;
gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 1024;

# Docker's embedded DNS, re-resolved so an api container restart never pins a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    # API and health endpoints go to the api container. Body cap and rate limits live in
    # the API (beacon.http.*); nginx only forwards. No add_header here, so the server-level
    # security headers above still apply to proxied responses.
    location /v1/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
    location /health/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links (/explore, /session, ...) resolve to index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
