# Included wherever add_header is used: nginx replaces (not merges) inherited add_header
# directives as soon as a block declares one, so every block that sets a header includes
# this file. `always` keeps the headers on error responses too.
# CSP: the Vite build has no inline scripts (modulePreload polyfill off); 'unsafe-inline'
# is scoped to style-src for React style attributes, never to scripts (TM-10, TM-32).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
