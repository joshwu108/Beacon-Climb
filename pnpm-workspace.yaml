packages:
  - apps/web
  - apps/mobile

# apps/mobile (Expo SDK 58): hold every Expo / React Native package at its newest release
# published on or before 2026-10-06 (the 14-day cutoff the direct pins in
# apps/mobile/package.json follow), so caret ranges inside the SDK do not float to
# releases from the last two weeks. apps/web uses none of these packages.
