[project]
name = "beacon-climb-ml"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = true

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
torch-cpu = ["torch==2.14.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "datasets"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
